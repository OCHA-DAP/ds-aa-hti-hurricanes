# Databricks Asset Bundle — runs the Haiti hurricane trigger monitoring
# as a DBX job (same conventions as ds-storms-alerts).
#
#   databricks bundle deploy -p default                        # deploy prod
#   databricks bundle run hti_monitoring -p default            # manual run
#   databricks bundle run hti_monitoring -p default --params test_email=True,dry_run=True
#
# The `dev` target is for feature-branch testing (auto-pauses the
# schedule, test list only):
#
#   databricks bundle deploy  -t dev -p default --var git_branch=my-feature
#   databricks bundle run     hti_monitoring -t dev -p default
#   databricks bundle destroy -t dev -p default
#
# The job clones this repo (source: GIT) at ${var.git_branch} and runs
# databricks/run_monitor_job.py, which shells out to
# pipelines/monitor.py. Exposure/WSP inputs come from the DEV storms DB
# (where ds-storms-pipeline writes); rain comes from CHIRPS-GEFS (blob)
# and IMERG (prod DB), as before.

bundle:
  name: ds-aa-hti-hurricanes

sync:
  exclude:
    - "data/**"
    - "exploration/**"
    - "temp/**"

variables:
  existing_cluster_id:
    description: Interactive cluster the job runs on (carries the DSCI_AZ_* env vars)
    default: "0515-161935-i2w5mxhc"
  git_branch:
    description: Branch the job pulls the pipeline from
    default: main
  dry_run:
    description: '"True" = update monitoring + build emails but send nothing; "False" = send'
    default: "False"
  test_email:
    # Default is the safe test list; flip to "False" at framework go-live
    # to send to the real AA Haïti Listmonk lists.
    description: '"True" = internal test list; "False" = real AA Haïti lists'
    default: "True"

targets:
  prod:
    mode: production
    default: true
    workspace:
      profile: default
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Live since 2026-08-11: send to the AA Haïti Listmonk lists
      # (116 info / 117 déclencheurs). Subscribers are managed in
      # Listmonk; see pipelines/setup_listmonk_lists.py.
      test_email: "False"
  dev:
    mode: development
    workspace:
      profile: default

resources:
  jobs:
    hti_monitoring:
      name: HTI Hurricane Monitoring
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-aa-hti-hurricanes.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      schedule:
        # 03:50 / 09:50 / 15:50 / 21:50 UTC — after ds-storms-pipeline's
        # :00/:30 runs have landed the advisory's tracks/exposure/WSP.
        # Advisories not yet in the DB are deferred to the next run.
        quartz_cron_expression: "0 50 3,9,15,21 * * ?"
        timezone_id: UTC

      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - tristan.downing@un.org
        no_alert_for_skipped_runs: true

      parameters:
        - name: test_email
          default: ${var.test_email}
        - name: dry_run
          default: ${var.dry_run}

      tasks:
        - task_key: run_monitoring
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: databricks/run_monitor_job.py
            source: GIT
            parameters:
              - "{{job.parameters.test_email}}"
              - "{{job.parameters.dry_run}}"
          libraries:
            - pypi: { package: "ocha-stratus>=0.1.7" }
            - pypi:
                package: "ocha-relay @ git+https://github.com/OCHA-DAP/ocha-relay.git@v0.3.0"
            - pypi: { package: "ocha-lens==0.5.1" }
            - pypi: { package: "exactextract" }
            - pypi: { package: "matplotlib>=3.9" }
            - pypi: { package: "geopandas>=1.0" }
            - pypi: { package: "rioxarray>=0.15" }
            - pypi: { package: "azure-storage-blob>=12.20" }
            - pypi: { package: "databricks-sdk" }
