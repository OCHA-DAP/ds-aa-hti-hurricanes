# Databricks Asset Bundle — runs the Haiti hurricane trigger monitoring
# as a DBX job (same conventions as ds-storms-alerts).
#
#   databricks bundle deploy -p default                        # deploy prod
#   databricks bundle run hti_monitoring -p default            # manual run
#   databricks bundle run hti_monitoring -p default --params test_email=True,dry_run=True
#
# The `dev` target is for feature-branch testing (auto-pauses the
# schedule, test list only):
#
#   databricks bundle deploy  -t dev -p default --var git_branch=my-feature
#   databricks bundle run     hti_monitoring -t dev -p default
#   databricks bundle destroy -t dev -p default
#
# The job clones this repo (source: GIT) at ${var.git_branch} and runs
# databricks/run_monitor_job.py, which shells out to
# pipelines/monitor.py. Exposure/WSP inputs come from the DEV storms DB
# (where ds-storms-pipeline writes); rain comes from CHIRPS-GEFS (blob)
# and IMERG (prod DB), as before.

bundle:
  name: ds-aa-hti-hurricanes

sync:
  exclude:
    - "data/**"
    - "exploration/**"
    - "temp/**"

variables:
  git_branch:
    description: Branch the job pulls the pipeline from
    default: main
  dry_run:
    description: '"True" = update monitoring + build emails but send nothing; "False" = send'
    default: "False"
  dgpc_storms:
    description: 'Storms for the DGPC rain job; "" = all, else "AL142016 AL132025"'
    default: ""
  test_email:
    # Default is the safe test list; flip to "False" at framework go-live
    # to send to the real AA Haïti Listmonk lists.
    description: '"True" = internal test list; "False" = real AA Haïti lists'
    default: "True"

targets:
  prod:
    mode: production
    default: true
    workspace:
      profile: default
      root_path: /Workspace/Users/adm.tdowning@global.un.org/.bundle/${bundle.name}/${bundle.target}
    variables:
      # Live since 2026-08-11: send to the AA Haïti Listmonk lists
      # (116 info / 117 déclencheurs). Subscribers are managed in
      # Listmonk; see pipelines/setup_listmonk_lists.py.
      test_email: "False"
  dev:
    mode: development
    workspace:
      profile: default

resources:
  jobs:
    hti_monitoring:
      name: HTI Hurricane Monitoring
      permissions:
        # Zack covers monitoring operations during Tristan's leave
        # (Aug 2026). Job-level, not bundle-level: this workspace tier
        # has no directory ACLs, so bundle permissions fail to apply.
        - user_name: adm.zarno1@global.un.org
          level: CAN_MANAGE
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-aa-hti-hurricanes.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      schedule:
        # 03:50 / 09:50 / 15:50 / 21:50 UTC — after ds-storms-pipeline's
        # :00/:30 runs have landed the advisory's tracks/exposure/WSP.
        # Advisories not yet in the DB are deferred to the next run.
        quartz_cron_expression: "0 50 3,9,15,21 * * ?"
        timezone_id: UTC

      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - tristan.downing@un.org
          - zachary.arno@un.org
        no_alert_for_skipped_runs: true

      parameters:
        - name: test_email
          default: ${var.test_email}
        - name: dry_run
          default: ${var.dry_run}

      # Ephemeral Job Compute under the team policy (000C79D951EAF0D6),
      # not a standing interactive cluster: the policy injects the
      # DSCI_AZ_*/IMERG_* creds, and anyone with CAN_MANAGE on the job
      # can operate it without permissions on someone's personal
      # cluster. Listmonk creds come from databricks/run_monitor_job.py
      # (dbutils.secrets), not the cluster env. The policy forbids
      # single-node and fixes num_workers=1; the monitor is plain
      # Python on the driver, so the worker just idles.
      job_clusters:
        - job_cluster_key: monitor_cluster
          new_cluster:
            policy_id: "000C79D951EAF0D6"
            spark_version: "18.2.x-scala2.13"
            node_type_id: "Standard_DS4_v2"
            num_workers: 1
            data_security_mode: SINGLE_USER
            azure_attributes:
              # The policy fixes spot_bid_max_price=100; set explicitly
              # because the provider's -1 default is rejected.
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100

      tasks:
        - task_key: run_monitoring
          job_cluster_key: monitor_cluster
          spark_python_task:
            python_file: databricks/run_monitor_job.py
            source: GIT
            parameters:
              - "{{job.parameters.test_email}}"
              - "{{job.parameters.dry_run}}"
          libraries:
            - pypi: { package: "ocha-stratus>=0.1.7" }
            - pypi:
                package: "ocha-relay @ git+https://github.com/OCHA-DAP/ocha-relay.git@v0.3.0"
            - pypi: { package: "ocha-lens==0.5.1" }
            - pypi: { package: "exactextract" }
            - pypi: { package: "matplotlib>=3.9" }
            - pypi: { package: "geopandas>=1.0" }
            - pypi: { package: "rioxarray>=0.15" }
            - pypi: { package: "azure-storage-blob>=12.20" }
            - pypi: { package: "databricks-sdk" }

    # One-off analysis job (no schedule): evaluates the DGPC rainfall
    # criteria against IMERG half-hourly for every storm in the Haiti set.
    #
    #   databricks bundle deploy -p default
    #   databricks bundle run dgpc_rain -p default --params dgpc_storms=AL142016
    #   databricks bundle run dgpc_rain -p default        # all 42 storms
    #
    # It exists as a DBX job rather than a local script only because the
    # Earthdata credentials live in the `dsci` secret scope and are
    # injected by the compute policy — nobody has to hold the password.
    dgpc_rain:
      name: HTI DGPC Rainfall Analysis
      permissions:
        - user_name: adm.zarno1@global.un.org
          level: CAN_MANAGE
      git_source:
        git_url: https://github.com/OCHA-DAP/ds-aa-hti-hurricanes.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      # Manual only — this is an analysis backfill, not a monitor.
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - tristan.downing@un.org
        no_alert_for_skipped_runs: true

      parameters:
        - name: dgpc_storms
          default: ${var.dgpc_storms}

      job_clusters:
        - job_cluster_key: dgpc_cluster
          new_cluster:
            policy_id: "000C79D951EAF0D6"
            spark_version: "18.2.x-scala2.13"
            node_type_id: "Standard_DS4_v2"
            num_workers: 1
            data_security_mode: SINGLE_USER
            azure_attributes:
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100

      tasks:
        - task_key: run_dgpc_rain
          job_cluster_key: dgpc_cluster
          # ~14 000 OPeNDAP granule fetches; well clear of a normal run
          # but bounded so a hung fetch cannot burn compute indefinitely.
          timeout_seconds: 21600
          spark_python_task:
            python_file: databricks/run_dgpc_rain_job.py
            source: GIT
            parameters:
              - "{{job.parameters.dgpc_storms}}"
          libraries:
            - pypi: { package: "ocha-stratus>=0.1.7" }
            - pypi: { package: "exactextract" }
            - pypi: { package: "geopandas>=1.0" }
            - pypi: { package: "rioxarray>=0.15" }
            - pypi: { package: "netcdf4" }
            - pypi: { package: "azure-storage-blob>=12.20" }
            - pypi: { package: "databricks-sdk" }
