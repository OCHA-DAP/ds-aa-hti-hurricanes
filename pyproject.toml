[project]
name = "ds-aa-hti-hurricanes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "azure-storage-blob>=12.20.0",
    "cftime>=1.6.3",
    "dask>=2025.5.1",
    "fiona>=1.9.6",
    "fsspec>=2024.6.0",
    "geopandas>=1.1.0",
    "html2text>=2024.2.26",
    "Jinja2>=3.1.6",
    "kaleido==0.2.1",
    "matplotlib>=3.8.3",
    "pandas>=2.2.2",
    "plotly>=5.22.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.3",
    "rioxarray>=0.19.0",
    "scipy>=1.13.1",
    "shapely>=2.0.4",
    "tqdm>=4.66.2",
    "xarray>=2024.7.0",
    "ocha-stratus>=0.1.3",
    "sqlalchemy>=2.0.0",
    "marimo>=0.23.5",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
